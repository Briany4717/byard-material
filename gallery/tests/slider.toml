# Scenarios for m.Slider and m.RangeSlider, on the SliderScenarios view. A slider is 280 long
# at x 32 and its handle travels from x 40 to 304: a press at x = 40 + 264 * t sets t.
view = "SliderScenarios"
size = "440x400"

[[test]]
name = "each slider has the slider role, a name and its value"
exact = [
    'Slider "Volume" = "50" [focusable]',
    'Slider "Level" = "0.5" [focusable]',
    'Slider "Range start" = "20" [focusable]',
    'Slider "Range end" = "80" [focusable]',
    'Slider "Locked" = "0.5" [focusable disabled]',
    'Label "Volume 50, level 0.50, range 20 to 80"',
]

[[test]]
name = "a tap on the track sets the value, snapped to the step"
steps = [{ tap = [251, 70] }]
expect = ['Slider "Volume" = "80"', 'Label "Volume 80, level 0.50, range 20 to 80"']

[[test]]
name = "a tap on a continuous track sets it where it lands"
steps = [{ tap = [106, 170] }]
expect = ['Slider "Level" = "0.25"']

[[test]]
name = "Tab reaches the first slider and Right steps it"
steps = [{ key = "Tab" }, { key = "Right" }]
expect = ['Slider "Volume" = "60" [focusable focused]']

[[test]]
name = "Left steps down, and the value stops at the minimum"
steps = [{ key = "Tab" }, { key = "Left" }, { key = "Left" }, { key = "Left" }, { key = "Left" }, { key = "Left" }, { key = "Left" }]
expect = ['Slider "Volume" = "0"']

[[test]]
name = "a continuous slider steps by a tenth of its range"
steps = [{ key = "Tab" }, { key = "Tab" }, { key = "Right" }]
expect = ['Slider "Level" = "0.6"']

[[test]]
name = "the range's two handles are two sliders, Tab visits both"
steps = [{ key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "Right" }]
expect = ['Slider "Range start" = "30" [focusable focused]', 'Label "Volume 50, level 0.50, range 30 to 80"']

[[test]]
name = "the end handle moves on its own"
steps = [{ key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "Left" }]
expect = ['Slider "Range end" = "70"', 'Label "Volume 50, level 0.50, range 20 to 70"']

[[test]]
name = "a tap near the start handle moves the start, one near the end moves the end"
steps = [{ tap = [60, 270] }, { tap = [290, 270] }]
expect = ['Slider "Range start" = "10"', 'Slider "Range end" = "90"']

[[test]]
name = "the start handle stops one step short of the end handle"
steps = [{ key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "Right" }, { key = "Right" }, { key = "Right" }, { key = "Right" }, { key = "Right" }, { key = "Right" }, { key = "Right" }, { key = "Right" }]
expect = ['Slider "Range start" = "70"', 'Slider "Range end" = "80"', 'Label "Volume 50, level 0.50, range 70 to 80"']

[[test]]
name = "a disabled slider is skipped by Tab and cannot be tapped"
steps = [{ tap = [172, 370] }]
expect = ['Slider "Locked" = "0.5" [focusable disabled]']

[[test]]
name = "the same in the dark scheme"
scheme = "dark"
steps = [{ key = "Tab" }, { key = "Right" }]
expect = ['Slider "Volume" = "60"']

# Dragging: --hold / --release in a test are `hold` and `release`, with `hover` moving between.
[[test]]
name = "dragging the handle follows the pointer and snaps to the step"
steps = [{ hold = [172, 70] }, { hover = [220, 70] }, { hover = [251, 70] }, { release = [251, 70] }]
expect = ['Slider "Volume" = "80"']

[[test]]
name = "a drag can leave the slider and the value stops at the end"
steps = [{ hold = [172, 70] }, { hover = [400, 70] }, { release = [400, 70] }]
expect = ['Slider "Volume" = "100"']

[[test]]
name = "a drag past the start stops at the minimum"
steps = [{ hold = [172, 70] }, { hover = [-20, 70] }, { release = [-20, 70] }]
expect = ['Slider "Volume" = "0"']

[[test]]
name = "a drag on a continuous slider sets the value under the pointer"
steps = [{ hold = [172, 170] }, { hover = [100, 170] }, { release = [100, 170] }]
expect = ["Slider \"Level\" = \"0.2272"]

[[test]]
name = "a press that is held already moved the value to the pointer"
steps = [{ hold = [304, 170] }]
expect = ['Slider "Level" = "1"']

[[test]]
name = "dragging the end handle of the range moves only it"
steps = [{ hold = [249, 270] }, { hover = [200, 270] }, { hover = [160, 270] }, { release = [160, 270] }]
expect = ['Slider "Range start" = "20"', 'Slider "Range end" = "50"']

[[test]]
name = "the start handle cannot be dragged past the end handle"
steps = [{ hold = [93, 270] }, { hover = [200, 270] }, { hover = [300, 270] }, { release = [300, 270] }]
expect = ['Slider "Range start" = "70"', 'Slider "Range end" = "80"']

[[test]]
name = "Home and End jump to the ends"
steps = [{ key = "Tab" }, { key = "End" }]
expect = ['Slider "Volume" = "100"']

[[test]]
name = "End then Home"
steps = [{ key = "Tab" }, { key = "End" }, { key = "Home" }]
expect = ['Slider "Volume" = "0"']

# PageUp and PageDown are handled (a tenth of the range) but `byard test` and `shot --key` have no
# name for them, so no scenario presses them.

[[test]]
name = "Up and Down are arrows too"
steps = [{ key = "Tab" }, { key = "Up" }, { key = "Up" }, { key = "Down" }]
expect = ['Slider "Volume" = "60" [focusable focused]']

[[test]]
name = "Home on the end handle stops at the start handle"
steps = [{ key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "Home" }]
expect = ['Slider "Range start" = "20"', 'Slider "Range end" = "30"']

[[test]]
name = "End on the start handle stops at the end handle"
steps = [{ key = "Tab" }, { key = "Tab" }, { key = "Tab" }, { key = "End" }]
expect = ['Slider "Range start" = "70"', 'Slider "Range end" = "80"']
