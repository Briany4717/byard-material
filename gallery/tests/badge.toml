# Scenarios for m.Badge and m.BadgedIcon, on the BadgeScenarios view.
view = "BadgeScenarios"
size = "440x400"

[[test]]
name = "a badge says its count and what it counts"
exact = [
    'Image "New alerts"',
    'Image "7 unread messages"',
    'Image "more than 999 unread messages"',
    'Label "Mail"',
    'Image "3 unread messages"',
]

[[test]]
name = "a single digit is a 16 by 16 circle and a longer count is wider"
expect = ['Image "7 unread messages" @ 24,46 16x16', 'Image "more than 999 unread messages" @ 24,78 33x16']
