# Scenarios for m.BottomSheet and m.SideSheet, on the SheetsScenarios view.
view = "SheetsScenarios"
size = "440x560"

[[test]]
name = "closed, there are no sheets"
expect = ['Label "Bottom: no"', 'Label "Side: no"']
not = ['Dialog']

[[test]]
name = "the bottom sheet opens with a drag handle and its content"
steps = [{ tap = 'Button "Open bottom"' }]
expect = ['Dialog "Bottom sheet"', 'Slider "Drag handle" = "collapsed"', 'Label "Share with"']

[[test]]
name = "Escape and a tap on the scrim close the bottom sheet"
steps = [{ tap = 'Button "Open bottom"' }, { key = "Escape" }, { expect = ['Label "Bottom: no"'] }, { tap = 'Button "Open bottom"' }, { tap = [200, 40] }]
expect = ['Label "Bottom: no"']
not = ['Dialog']

[[test]]
name = "the modal side sheet opens, Tab stays in it, its close button closes it"
steps = [{ tap = 'Button "Open side"' }, { expect = ['Dialog "Filters"', 'Label "Stock"'] }, { key = "Tab" }, { expect = ['Button "Close" [focusable focused]'] }, { key = "Tab" }, { expect = ['Button "Close" [focusable focused]'] }, { key = "Space" }]
expect = ['Label "Side: no"']
not = ['Dialog']

[[test]]
name = "Escape closes the modal side sheet"
steps = [{ tap = 'Button "Open side"' }, { key = "Escape" }]
expect = ['Label "Side: no"']
not = ['Dialog']

[[test]]
name = "a standard side sheet leaves the page live"
steps = [{ tap = 'Button "Toggle standard"' }, { expect = ['Dialog "Details"', 'Label "Beside"'] }, { tap = 'Button "Open bottom"' }]
expect = ['Label "Bottom: yes"']

[[test]]
name = "the same in the dark scheme"
scheme = "dark"
steps = [{ tap = 'Button "Open side"' }]
expect = ['Dialog "Filters"']
