# Scenarios for m.Fab, m.ExtendedFab and m.FabMenu, on the FabScenarios view.
view = "FabScenarios"
size = "440x560"

[[test]]
name = "each is a named button"
expect = ['Button "Compose" [focusable]', 'Button "Share" [focusable]', 'Button "Add" [focusable collapsed]']

[[test]]
name = "a tap presses the fab"
steps = [{ tap = 'Button "Compose"' }]
expect = ['Label "Taps: 1"']

[[test]]
name = "Tab and Space press the fab"
steps = [{ key = "Tab" }, { key = "Space" }]
expect = ['Label "Taps: 1"', 'Button "Compose" [focusable focused]']

[[test]]
name = "collapsing the extended fab shrinks it"
steps = [{ tap = 'Button "Share"' }, { wait = 1500 }]
expect = ['Button "Share" [focusable focused] @ 96,24 80x80']

[[test]]
name = "the extended fab slides closed and open, not in one step"
steps = [
    { tap = 'Button "Share"' },
    { not = ['Button "Share" [focusable focused] @ 96,24 80x80'] },
    { wait = 1500 },
    { tap = 'Button "Share"' },
    { not = ['Button "Share" [focusable focused] @ 96,24 80x80'] },
    { wait = 1500 },
]
not = ['@ 96,24 80x80']

[[test]]
name = "the menu opens, listing its items, and the fab becomes a close button"
steps = [{ tap = 'Button "Add"' }]
expect = ['Label "Open: yes"', 'Button "Close menu" [focusable expanded]', 'MenuItem "Photo"', 'MenuItem "Video"']

[[test]]
name = "focus moves into the menu, to the first item"
steps = [{ tap = 'Button "Add"' }]
expect = ['Menu', 'MenuItem "Photo" [focusable focused]', 'MenuItem "Video" [focusable]']

[[test]]
name = "Down moves to the next item and Up goes back"
steps = [{ tap = 'Button "Add"' }, { key = "ArrowDown" }, { expect = ['MenuItem "Video" [focusable focused]'] }, { key = "ArrowUp" }]
expect = ['MenuItem "Photo" [focusable focused]']

[[test]]
name = "Enter on the focused item picks it"
steps = [{ tap = 'Button "Add"' }, { key = "ArrowDown" }, { key = "Enter" }]
expect = ['Label "Picked: 1"', 'Label "Open: no"']

[[test]]
name = "choosing an item closes the menu and reports it"
steps = [{ tap = 'Button "Add"' }, { tap = 'MenuItem "Video"' }]
expect = ['Label "Picked: 1"', 'Label "Open: no"']
not = ['MenuItem']

[[test]]
name = "Escape closes the menu and focus is back on the button"
steps = [{ tap = 'Button "Add"' }, { key = "Escape" }, { wait = 1000 }]
expect = ['Label "Open: no"', 'Button "Add" [focusable focused collapsed]']
not = ['MenuItem']

[[test]]
name = "the items stay drawn, inert, while they leave"
steps = [{ tap = 'Button "Add"' }, { wait = 1000 }, { key = "Escape" }, { expect = ['Label "Open: no"'] }, { wait = 1000 }]
not = ['MenuItem']

[[test]]
name = "a tap outside closes the menu"
steps = [{ tap = 'Button "Add"' }, { tap = 'Label "Taps: 0"' }]
expect = ['Label "Open: no"']
not = ['MenuItem']

[[test]]
name = "the same in the dark scheme"
scheme = "dark"
steps = [{ tap = 'Button "Add"' }]
expect = ['MenuItem "Photo"']

[[test]]
name = "a medium fab is 80 across, the baseline one 56"
expect = ['Button "Medium" [focusable] @ 260,24 80x80', 'Button "Compose" [focusable] @ 24,36 56x56']
